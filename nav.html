<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GK网站点</title>
<meta name="description" content="GK网站点">

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding: 20px;
    background-color: #f9f9f9;
}
h1 {
    font-size: 2rem;
    margin-bottom: 20px;
}

/* 展开/隐藏菜单的控制按钮 */
.menu-toggle {
    background-color: #333;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.9rem;
    cursor: pointer;
    margin-bottom: 15px;
}

/* 分页导航栏（支持左右滑动） */
.pagination-nav {
    display: flex; /* 默认显示 */
    white-space: nowrap;
    overflow-x: auto;
    padding: 10px 5px;
    margin: 0 auto 25px auto;
    width: 90%;
    max-width: 500px;
    gap: 10px;
    -webkit-overflow-scrolling: touch; 
}
.pagination-nav::-webkit-scrollbar {
    display: none; /* 隐藏滚动条 */
}

/* 【新增】当加上这个类名时，导航栏彻底隐藏 */
.pagination-nav.hidden {
    display: none;
}

/* 分页按钮 */
.page-btn {
    padding: 8px 16px;
    background-color: #e0e0e0;
    color: #333;
    border: none;
    border-radius: 20px;
    font-size: 1rem;
    cursor: pointer;
    flex-shrink: 0;
}
.page-btn.active {
    background-color: #4CAF50;
    color: white;
}

/* 分页内容的显示与隐藏 */
.page-content { display: none; }
.page-content.active { display: block; }

/* 分类标题 */
h2 {
    font-size: 1.4rem;
    color: #333;
    margin-top: 30px;
    margin-bottom: 15px;
    padding-bottom: 5px;
    border-bottom: 2px solid #4CAF50;
    display: inline-block;
    width: 90%;
    max-width: 500px;
    text-align: left;
}

/* 链接按钮 */
a {
    display: block;
    margin: 15px auto;
    padding: 15px;
    width: 90%;
    max-width: 500px;
    background: #4CAF50;
    color: white;
    text-decoration: none;
    border-radius: 10px;
    font-size: 1.2rem;
    box-sizing: border-box;
}
a:hover { opacity: 0.8; }
</style>
</head>

<body>

<h1>GK网站点</h1>

<button class="menu-toggle" onclick="toggleMenu()">显示/隐藏分页</button>

<div id="navBar" class="pagination-nav">
    <button class="page-btn active" onclick="switchPage(this, 'page1')">项目1</button>
    <button class="page-btn" onclick="switchPage(this, 'page2')">自定义分页</button>
    <button class="page-btn" onclick="switchPage(this, 'page3')">自定义分页</button>
    <button class="page-btn" onclick="switchPage(this, 'page4')">自定义分页</button>
</div>


<div id="page1" class="page-content active">
    <h2>项目</h2>
    <a href="editor.html">HTML编辑器</a>
    <a href="web-toolbox.html">Tool</a>
    <a href="SketchFlow.html">SketchFlow</a>
    <a href="folder/x.html">SoloTalk</a>
    <a href="index.html">我的世界</a>
    <a href="bear-pub-game.html">Bear Tavern</a>
    <a href="folder/BIT-2048.html">2048</a>
    <a href="folder/Blue-Archive-FanProject.html">BA-FanProject</a>
    <a href="folder/Peak-Load.html">Peak-Load</a>
    <a href="folder/Corruptor.html">Corruptor</a>
    <a href="folder/Fruit-Ninja-Blade-Symphony.html">Fruit-Ninja-Blade-Symphony</a>
    <a href="folder/roblox.html">ro</a>
    <a href="folder/ZenTris.html">ZenTris</a>
    <a href="folder/test.html">test</a>
    <a href="GAME OVER.html">Simple Animation</a>
    <a href="B.html">星际飞船</a>
</div>

<div id="page2" class="page-content">
    <h2>自定义分类名</h2>
</div>

<div id="page3" class="page-content">
    <h2>自定义分类名</h2>
</div>

<div id="page4" class="page-content">
    <h2>自定义分类名</h2>
</div>


<script>
// 切换页面的核心代码
function switchPage(btn, pageId) {
    document.querySelectorAll('.page-content, .page-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    btn.classList.add('active');
}

// 【新增】控制导航菜单显示或隐藏的代码，只有一行，非常简单！
function toggleMenu() {
    document.getElementById('navBar').classList.toggle('hidden');
}
</script>

</body>
</html>
