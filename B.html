<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON VANGUARD </title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #030308;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 5;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,255,204,0.8);
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 3, 8, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            z-index: 10;
            transition: opacity 0.3s ease;
        }
        .hidden {
            opacity: 0;
            pointer-events: none !important;
            display: none !important;
        }
        .top-bar-left, .top-bar-right {
            position: absolute;
            top: 20px;
            display: flex;
            gap: 10px;
            z-index: 20;
            transition: opacity 0.3s ease;
        }
        .top-bar-left { left: 20px; }
        .top-bar-right { right: 20px; }

        .cyber-btn-small {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            text-shadow: 0 0 5px rgba(0,255,204,0.5);
            box-shadow: 0 0 8px rgba(0,255,204,0.2);
            pointer-events: auto;
        }
        .cyber-btn-small:hover {
            background: rgba(0, 255, 204, 0.3);
            box-shadow: 0 0 15px rgba(0,255,204,0.6);
        }

        h1 {
            font-size: 3.2rem;
            margin-bottom: 30px;
            color: #00ffcc;
            text-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffcc;
            text-align: center;
            letter-spacing: 3px;
        }
        .btn {
            background: linear-gradient(135deg, #ff0055, #ff3300);
            border: 2px solid #ff0055;
            padding: 16px 50px;
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255,0,85,0.6), inset 0 0 10px rgba(255,255,255,0.2);
            transition: transform 0.1s, box-shadow 0.1s;
            outline: none;
            letter-spacing: 2px;
            pointer-events: auto;
        }
        .btn:active {
            transform: scale(0.96);
            box-shadow: 0 0 10px rgba(255,0,85,0.8);
        }
        .tips {
            font-size: 0.95rem;
            color: #8080a0;
            margin-top: 25px;
            letter-spacing: 1px;
        }

        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 3, 8, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
        }
        .modal h2 {
            color: #00ffcc;
            margin-bottom: 20px;
            font-size: 2rem;
            text-shadow: 0 0 15px #00ffcc;
        }
        .score-list {
            list-style: none;
            width: 300px;
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 25px;
        }
        .score-list li {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 204, 0.3);
            padding: 12px 20px;
            margin-bottom: 8px;
            display: flex;
            justify-content: center;
            font-size: 1.1rem;
            border-radius: 4px;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <div id="top-bar-container">
        <div class="top-bar-left" id="top-left-bar">
            <button class="cyber-btn-small" id="export-btn">导出数据</button>
            <button class="cyber-btn-small" id="import-btn">导入数据</button>
            <input type="file" id="import-file" style="display: none;" accept=".json">
        </div>

        <div class="top-bar-right" id="top-right-bar">
            <button class="cyber-btn-small" id="history-btn">历史战绩</button>
        </div>
    </div>

    <div id="ui-layer">
        <div class="hud">
            <div id="score-display">得分: 0</div>
            <div id="high-score-display">最高分: 0</div>
            <div id="health-display">护盾: ❤️❤️❤️</div>
        </div>
    </div>

    <div id="start-screen" class="screen">
        <h1>NEON VANGUARD</h1>
        <button class="btn" id="start-btn">开始游戏</button>
        <div class="tips">电脑端方向键/WASD + 空格，手机端直接拖拽</div>
    </div>

    <div id="gameover-screen" class="screen hidden">
        <h1>战机坠毁</h1>
        <p id="final-score" style="font-size: 1.3rem; margin-bottom: 25px; color: #ff0055;">最终得分: 0</p>
        <button class="btn" id="restart-btn">再次挑战</button>
    </div>

    <!-- 历史战绩弹窗 -->
    <div id="history-modal" class="modal hidden">
        <h2>📜 历史战绩记录</h2>
        <ul id="score-list-ul" class="score-list">
            <!-- 动态生成 -->
        </ul>
        <button class="cyber-btn-small" id="close-history" style="padding: 10px 30px; font-size: 1rem;">返回菜单</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('gameover-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const scoreDisplay = document.getElementById('score-display');
        const highScoreDisplay = document.getElementById('high-score-display');
        const healthDisplay = document.getElementById('health-display');
        const finalScoreDisplay = document.getElementById('final-score');
        
        const exportBtn = document.getElementById('export-btn');
        const importBtn = document.getElementById('import-btn');
        const importFile = document.getElementById('import-file');
        const historyBtn = document.getElementById('history-btn');
        const historyModal = document.getElementById('history-modal');
        const closeHistory = document.getElementById('close-history');
        const scoreListUl = document.getElementById('score-list-ul');
        const topLeftBar = document.getElementById('top-left-bar');
        const topRightBar = document.getElementById('top-right-bar');

        let scoreHistory = JSON.parse(localStorage.getItem('neon_score_history')) || [];
        let highScore = scoreHistory.length > 0 ? Math.max(...scoreHistory) : 0;
        highScoreDisplay.innerText = `最高分: ${highScore}`;

        function recordScore(newScore) {
            scoreHistory.unshift(newScore);
            if (scoreHistory.length > 20) scoreHistory.pop();
            localStorage.setItem('neon_score_history', JSON.stringify(scoreHistory));
            highScore = Math.max(...scoreHistory);
            highScoreDisplay.innerText = `最高分: ${highScore}`;
        }

        exportBtn.addEventListener('click', () => {
            const data = {
                scoreHistory: scoreHistory,
                version: '2.0'
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'neon_vanguard_scores.json';
            a.click();
            URL.revokeObjectURL(url);
        });

        importBtn.addEventListener('click', () => importFile.click());
        importFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const data = JSON.parse(event.target.result);
                    if (data.scoreHistory && Array.isArray(data.scoreHistory)) {
                        scoreHistory = data.scoreHistory;
                        localStorage.setItem('neon_score_history', JSON.stringify(scoreHistory));
                        highScore = scoreHistory.length > 0 ? Math.max(...scoreHistory) : 0;
                        highScoreDisplay.innerText = `最高分: ${highScore}`;
                        alert('战绩数据导入成功！');
                    } else {
                        alert('文件格式错误！');
                    }
                } catch (err) {
                    alert('解析数据失败！');
                }
            };
            reader.readAsText(file);
        });

        historyBtn.addEventListener('click', () => {
            scoreListUl.innerHTML = '';
            if (scoreHistory.length === 0) {
                const li = document.createElement('li');
                li.innerText = '暂无游戏记录';
                scoreListUl.appendChild(li);
            } else {
                scoreHistory.forEach((s) => {
                    const li = document.createElement('li');
                    li.innerText = `得分: ${s}`;
                    scoreListUl.appendChild(li);
                });
            }
            historyModal.classList.remove('hidden');
        });
        closeHistory.addEventListener('click', () => {
            historyModal.classList.add('hidden');
        });

        let audioCtx = null;
        let bgmTimer = null;
        let bgmStep = 0;
        const synthNotes = [110, 110, 130.81, 146.83, 110, 98, 110, 164.81, 220, 196, 164.81, 130.81];

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            if (type === 'shoot') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                gain.gain.setValueAtTime(0.22, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'explosion') {
                const bufferSize = audioCtx.sampleRate * 0.45;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1);
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(700, now);
                filter.frequency.exponentialRampToValueAtTime(20, now + 0.45);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.65, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start(now);
            } else if (type === 'hit') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
                gain.gain.setValueAtTime(0.6, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'powerup') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(1050, now + 0.25);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        function startBGM() {
            if (bgmTimer) clearInterval(bgmTimer);
            bgmTimer = setInterval(() => {
                if (gameState !== 'PLAYING' || !audioCtx) return;
                const now = audioCtx.currentTime;
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                const freq = synthNotes[bgmStep % synthNotes.length];
                osc.frequency.setValueAtTime(freq, now);

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1000, now);

                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(now);
                osc.stop(now + 0.12);

                if (bgmStep % 4 === 0) {
                    const kick = audioCtx.createOscillator();
                    const kGain = audioCtx.createGain();
                    kick.frequency.setValueAtTime(150, now);
                    kick.frequency.exponentialRampToValueAtTime(25, now + 0.12);
                    kGain.gain.setValueAtTime(0.4, now);
                    kGain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    kick.connect(kGain);
                    kGain.connect(audioCtx.destination);
                    kick.start(now);
                    kick.stop(now + 0.12);
                }

                bgmStep++;
            }, 140);
        }

        function stopBGM() {
            if (bgmTimer) {
                clearInterval(bgmTimer);
                bgmTimer = null;
            }
        }

        let gameState = 'MENU';
        let score = 0;
        let health = 3;
        let gameTime = 0;
        let screenShake = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const player = {
            x: canvas.width / 2,
            y: canvas.height - 120,
            radius: 20,
            speed: 6,
            color: '#00ffcc',
            targetX: canvas.width / 2,
            targetY: canvas.height - 120,
            isDragging: false,
            shootTimer: 0,
            shootInterval: 12,
            powerLevel: 1
        };

        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, Space: false };

        window.addEventListener('keydown', e => {
            if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.ArrowUp = true;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.ArrowDown = true;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.ArrowLeft = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.ArrowRight = true;
            if (e.code === 'Space') keys.Space = true;
        });

        window.addEventListener('keyup', e => {
            if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.ArrowUp = false;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.ArrowDown = false;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.ArrowLeft = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.ArrowRight = false;
            if (e.code === 'Space') keys.Space = false;
        });

        window.addEventListener('pointerdown', e => {
            if (gameState !== 'PLAYING') return;
            player.isDragging = true;
            player.targetX = e.clientX;
            player.targetY = e.clientY;
        });

        window.addEventListener('pointermove', e => {
            if (!player.isDragging || gameState !== 'PLAYING') return;
            player.targetX = e.clientX;
            player.targetY = e.clientY;
        });

        window.addEventListener('pointerup', () => { player.isDragging = false; });

        let bullets = [];
        let enemies = [];
        let particles = [];
        let powerUps = [];
        let stars = [];

        for (let i = 0; i < 100; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2.5,
                speed: Math.random() * 2 + 0.5
            });
        }

        function initGame() {
            score = 0;
            health = 3;
            gameTime = 0;
            bullets = [];
            enemies = [];
            particles = [];
            powerUps = [];
            player.x = canvas.width / 2;
            player.y = canvas.height - 120;
            player.targetX = player.x;
            player.targetY = player.y;
            player.powerLevel = 1;
            updateHUD();
        }

        function updateHUD() {
            scoreDisplay.innerText = `得分: ${score}`;
            let hearts = '';
            for (let i = 0; i < health; i++) hearts += '❤️';
            healthDisplay.innerText = `护盾: ${hearts}`;
        }

        function createExplosion(x, y, color, count = 30) {
            playSound('explosion');
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 9 + 2;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 4 + 1.2,
                    color,
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.01
                });
            }
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            gameTime++;

            let dx = 0, dy = 0;
            if (keys.ArrowLeft) dx -= 1;
            if (keys.ArrowRight) dx += 1;
            if (keys.ArrowUp) dy -= 1;
            if (keys.ArrowDown) dy += 1;

            if (dx !== 0 || dy !== 0) {
                player.x += dx * player.speed;
                player.y += dy * player.speed;
                player.targetX = player.x;
                player.targetY = player.y;
            } else if (!player.isDragging) {
                player.x += (player.targetX - player.x) * 0.2;
                player.y += (player.targetY - player.y) * 0.2;
            } else {
                player.x += (player.targetX - player.x) * 0.3;
                player.y += (player.targetY - player.y) * 0.3;
            }

            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

            player.shootTimer++;
            if (player.shootTimer >= player.shootInterval || keys.Space) {
                player.shootTimer = 0;
                playSound('shoot');
                if (player.powerLevel === 1) {
                    bullets.push({ x: player.x, y: player.y - player.radius, vx: 0, vy: -14, radius: 4, color: '#00ffcc' });
                } else if (player.powerLevel === 2) {
                    bullets.push({ x: player.x - 9, y: player.y - player.radius, vx: 0, vy: -14, radius: 4, color: '#00ffcc' });
                    bullets.push({ x: player.x + 9, y: player.y - player.radius, vx: 0, vy: -14, radius: 4, color: '#00ffcc' });
                } else {
                    bullets.push({ x: player.x, y: player.y - player.radius, vx: 0, vy: -14, radius: 5, color: '#ffee00' });
                    bullets.push({ x: player.x - 14, y: player.y - player.radius + 6, vx: -1.2, vy: -13, radius: 4, color: '#00ffcc' });
                    bullets.push({ x: player.x + 14, y: player.y - player.radius + 6, vx: 1.2, vy: -13, radius: 4, color: '#00ffcc' });
                }
            }

            let spawnRate = Math.max(20, 60 - Math.floor(gameTime / 300) * 5);
            if (gameTime % spawnRate === 0) {
                const typeRand = Math.random();
                let enemyType = 'drone';
                let hp = 1;
                let size = 18;
                let color = '#ff0055';

                if (typeRand > 0.75 && gameTime > 300) {
                    enemyType = 'tank';
                    hp = 5;
                    size = 30;
                    color = '#ffaa00';
                } else if (typeRand > 0.5 && gameTime > 150) {
                    enemyType = 'fast';
                    hp = 1;
                    size = 14;
                    color = '#ff00ff';
                }

                enemies.push({
                    x: Math.random() * (canvas.width - size * 2) + size,
                    y: -size,
                    radius: size,
                    hp: hp,
                    maxHp: hp,
                    speed: enemyType === 'fast' ? 5.5 : (enemyType === 'tank' ? 1.8 : 3.2),
                    type: enemyType,
                    color: color
                });
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                if (b.y < -10 || b.x < 0 || b.x > canvas.width) {
                    bullets.splice(i, 1);
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y += e.speed;
                if (e.type === 'fast') {
                    e.x += Math.sin(gameTime / 12) * 3.5;
                }

                const distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
                if (distToPlayer < player.radius + e.radius) {
                    health--;
                    screenShake = 30;
                    playSound('hit');
                    createExplosion(e.x, e.y, e.color, 35);
                    enemies.splice(i, 1);
                    updateHUD();
                    if (health <= 0) {
                        gameOver();
                    }
                    continue;
                }

                if (e.y > canvas.height + e.radius) {
                    enemies.splice(i, 1);
                    continue;
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    const dist = Math.hypot(b.x - e.x, b.y - e.y);
                    if (dist < b.radius + e.radius) {
                        e.hp--;
                        bullets.splice(j, 1);
                        screenShake = 6;
                        createExplosion(b.x, b.y, '#ffffff', 6);

                        if (e.hp <= 0) {
                            createExplosion(e.x, e.y, e.color, 30);
                            score += e.maxHp * 15;

                            if (Math.random() < 0.18) {
                                powerUps.push({
                                    x: e.x,
                                    y: e.y,
                                    radius: 13,
                                    type: Math.random() > 0.45 ? 'power' : 'health'
                                });
                            }

                            enemies.splice(i, 1);
                            updateHUD();
                        }
                        break;
                    }
                }
            }

            for (let i = powerUps.length - 1; i >= 0; i--) {
                let p = powerUps[i];
                p.y += 2.8;
                const dist = Math.hypot(player.x - p.x, player.y - p.y);
                if (dist < player.radius + p.radius) {
                    playSound('powerup');
                    if (p.type === 'power') {
                        player.powerLevel = Math.min(3, player.powerLevel + 1);
                    } else if (p.type === 'health') {
                        health = Math.min(5, health + 1);
                    }
                    updateHUD();
                    powerUps.splice(i, 1);
                    continue;
                }
                if (p.y > canvas.height + 20) {
                    powerUps.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let pt = particles[i];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.alpha -= pt.decay;
                if (pt.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            if (screenShake > 0) screenShake *= 0.8;
        }

        function draw() {
            ctx.save();
            if (screenShake > 0.5) {
                const offsetX = (Math.random() - 0.5) * screenShake;
                const offsetY = (Math.random() - 0.5) * screenShake;
                ctx.translate(offsetX, offsetY);
            }

            ctx.fillStyle = '#030308';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffffff';
            stars.forEach(s => {
                s.y += s.speed;
                if (s.y > canvas.height) s.y = 0;
                ctx.globalAlpha = s.size / 3;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });
            ctx.globalAlpha = 1;

            createEngineTrail();

            ctx.shadowBlur = 18;
            ctx.shadowColor = player.color;
            ctx.strokeStyle = player.color;
            ctx.lineWidth = 3;
            ctx.fillStyle = '#0a0a1a';

            ctx.beginPath();
            ctx.moveTo(player.x, player.y - player.radius * 1.3);
            ctx.lineTo(player.x - player.radius, player.y + player.radius);
            ctx.lineTo(player.x, player.y + player.radius * 0.6);
            ctx.lineTo(player.x + player.radius, player.y + player.radius);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.shadowBlur = 12;
            bullets.forEach(b => {
                ctx.shadowColor = b.color;
                ctx.fillStyle = b.color;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            enemies.forEach(e => {
                ctx.shadowColor = e.color;
                ctx.strokeStyle = e.color;
                ctx.fillStyle = '#1a0510';
                ctx.lineWidth = 2.5;

                ctx.beginPath();
                if (e.type === 'tank') {
                    for (let i = 0; i < 6; i++) {
                        const angle = (i * Math.PI) / 3;
                        const hx = e.x + Math.cos(angle) * e.radius;
                        const hy = e.y + Math.sin(angle) * e.radius;
                        if (i === 0) ctx.moveTo(hx, hy);
                        else ctx.lineTo(hx, hy);
                    }
                } else {
                    ctx.moveTo(e.x, e.y + e.radius);
                    ctx.lineTo(e.x - e.radius, e.y - e.radius);
                    ctx.lineTo(e.x, e.y - e.radius * 0.5);
                    ctx.lineTo(e.x + e.radius, e.y - e.radius);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            });

            powerUps.forEach(p => {
                ctx.shadowBlur = 14;
                ctx.shadowColor = p.type === 'power' ? '#00ffcc' : '#ff0055';
                ctx.fillStyle = p.type === 'power' ? '#00ffcc' : '#ff0055';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#030308';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(p.type === 'power' ? 'P' : 'H', p.x, p.y);
            });

            particles.forEach(pt => {
                ctx.shadowBlur = 6;
                ctx.shadowColor = pt.color;
                ctx.fillStyle = pt.color;
                ctx.globalAlpha = pt.alpha;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.restore();
        }

        function createEngineTrail() {
            particles.push({
                x: player.x + (Math.random() - 0.5) * 10,
                y: player.y + player.radius,
                vx: (Math.random() - 0.5) * 1.2,
                vy: Math.random() * 3.5 + 2,
                radius: Math.random() * 2 + 1,
                color: '#00ffcc',
                alpha: 0.85,
                decay: 0.07
            });
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            stopBGM();
            recordScore(score);
            finalScoreDisplay.innerText = `最终得分: ${score}`;
            // 游戏结束时让顶部功能按钮重新显示
            topLeftBar.classList.remove('hidden');
            topRightBar.classList.remove('hidden');
            gameOverScreen.classList.remove('hidden');
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        startBtn.addEventListener('click', () => {
            initAudio();
            startScreen.classList.add('hidden');
            // 隐藏顶部功能按钮
            topLeftBar.classList.add('hidden');
            topRightBar.classList.add('hidden');
            initGame();
            gameState = 'PLAYING';
            startBGM();
        });

        restartBtn.addEventListener('click', () => {
            initAudio();
            gameOverScreen.classList.add('hidden');
            // 隐藏顶部功能按钮
            topLeftBar.classList.add('hidden');
            topRightBar.classList.add('hidden');
            initGame();
            gameState = 'PLAYING';
            startBGM();
        });

        loop();
    </script>
</body>
</html>
